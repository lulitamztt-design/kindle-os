<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogos e ferramentas para kindle</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <!-- Barra Superior -->
  <header class="barra-topo">
    <span>Painel</span>
    <button onclick="abrirTela('menu')">Início</button>
  </header>

  <!-- Tela 1: Menu Principal -->
  <main id="tela-menu" class="tela ativa">
    <div class="grade-apps">
      <button class="icone-app" onclick="abrirTela('notas')">📝 Notas</button>
      <button class="icone-app" onclick="abrirTela('tarefas')">☑️ Tarefas</button>
      <button class="icone-app" onclick="abrirTela('calc')">🧮Calculadora</button>
      <button class="icone-app" onclick="abrirTela('jogo')">👊🖐✌ ~Pedra, papel e tesoura</button>
    </div>
  </main>

  <!-- Tela 2: Bloco de Notas -->
  <section id="tela-notas" class="tela">
    <h2>Bloco de Notas</h2>
    <textarea id="campo-nota" rows="10" placeholder="Escreva aqui..."></textarea>
    <button class="btn-grande" onclick="salvarNota()">Salvar Nota</button>
  </section>

  <!-- Tela 3: Lista de Tarefas -->
  <section id="tela-tarefas" class="tela">
    <h2>Tarefas</h2>
    <input type="text" id="nova-tarefa" placeholder="Nova tarefa...">
    <button class="btn-grande" onclick="adicionarTarefa()">Adicionar</button>
    <ul id="lista-tarefas"></ul>
  </section>
  
    <!-- Tela 4: Calculadora -->
  <section id="tela-calc" class="tela">
    <h2>Calculadora</h2>
    <input type="text" id="visor-calc" readonly placeholder="0">
    <div class="grade-apps">
      <button onclick="digitarCalc('7')">7</button>
      <button onclick="digitarCalc('8')">8</button>
      <button onclick="digitarCalc('9')">9</button>
      <button onclick="digitarCalc('/')">÷</button>
      <button onclick="digitarCalc('4')">4</button>
      <button onclick="digitarCalc('5')">5</button>
      <button onclick="digitarCalc('6')">6</button>
      <button onclick="digitarCalc('*')">×</button>
      <button onclick="digitarCalc('1')">1</button>
      <button onclick="digitarCalc('2')">2</button>
      <button onclick="digitarCalc('3')">3</button>
      <button onclick="digitarCalc('-')">-</button>
      <button onclick="limparCalc()">C</button>
      <button onclick="digitarCalc('0')">0</button>
      <button onclick="calcularResultado()">=</button>
      <button onclick="digitarCalc('+')">+</button>
    </div>
  </section>

  <!-- Tela 5: Jogo Pedra, Papel e Tesoura -->
  <section id="tela-jogo" class="tela">
    <h2>Pedra, Papel, Tesoura</h2>
    <p id="resultado-jogo" style="margin: 16px 0; font-size: 18px;">Escolha sua jogada:</p>
    <div class="grade-apps">
      <button onclick="jogar('Pedra')">✊ Pedra</button>
      <button onclick="jogar('Papel')">✋ Papel</button>
      <button onclick="jogar('Tesoura')">✌️ Tesoura</button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
