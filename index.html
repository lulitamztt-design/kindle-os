<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Painel E-Ink</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <!-- Barra Superior -->
  <header class="barra-topo">
    <span>Meu Kindle OS</span>
    <button onclick="abrirTela('menu')">Início</button>
  </header>

  <!-- Tela 1: Menu Principal -->
  <main id="tela-menu" class="tela ativa">
    <div class="grade-apps">
      <button class="icone-app" onclick="abrirTela('notas')">📝 Notas</button>
      <button class="icone-app" onclick="abrirTela('tarefas')">☑️ Tarefas</button>
      <button class="icone-app" onclick="abrirTela('calc')">🧮 Calculadora</button>
      <button class="icone-app" onclick="abrirTela('jogo')">✊ Jokenpô</button>
    </div>
  </main>

  <!-- Tela 2: Bloco de Notas -->
  <section id="tela-notas" class="tela">
    <h2>Bloco de Notas</h2>
    <textarea id="campo-nota" rows="10" placeholder="Escreva aqui..."></textarea>
    <button class="btn-grande" onclick="salvarNota()">Salvar Nota</button>
  </section>

  <!-- Tela 3: Lista de Tarefas -->
  <section id="tela-tarefas" class="tela">
    <h2>Tarefas</h2>
    <input type="text" id="nova-tarefa" placeholder="Nova tarefa...">
    <button class="btn-grande" onclick="adicionarTarefa()">Adicionar</button>
    <ul id="lista-tarefas"></ul>
  </section>

  <!-- Tela 4: Calculadora -->
  <section id="tela-calc" class="tela">
    <h2>Calculadora</h2>
    <input type="text" id="visor-calc" readonly placeholder="0">
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px;">
      <button onclick="digitarCalc('7')">7</button>
      <button onclick="digitarCalc('8')">8</button>
      <button onclick="digitarCalc('9')">9</button>
      <button onclick="digitarCalc('/')">÷</button>
      <button onclick="digitarCalc('4')">4</button>
      <button onclick="digitarCalc('5')">5</button>
      <button onclick="digitarCalc('6')">6</button>
      <button onclick="digitarCalc('*')">×</button>
      <button onclick="digitarCalc('1')">1</button>
      <button onclick="digitarCalc('2')">2</button>
      <button onclick="digitarCalc('3')">3</button>
      <button onclick="digitarCalc('-')">-</button>
      <button onclick="limparCalc()">C</button>
      <button onclick="digitarCalc('0')">0</button>
      <button onclick="calcularResultado()">=</button>
      <button onclick="digitarCalc('+')">+</button>
    </div>
  </section>

  <!-- Tela 5: Jogo Pedra, Papel e Tesoura -->
  <section id="tela-jogo" class="tela">
    <h2>Pedra, Papel, Tesoura</h2>
    <p id="resultado-jogo" style="margin: 16px 0; font-size: 18px; font-weight: bold;">Escolha sua jogada:</p>
    <div class="grade-apps">
      <button onclick="jogar('Pedra')">✊ Pedra</button>
      <button onclick="jogar('Papel')">✋ Papel</button>
      <button onclick="jogar('Tesoura')">✌️ Tesoura</button>
    </div>
  </section>

  <script>
    function abrirTela(nomeTela) {
      var telas = document.querySelectorAll('.tela');
      for (var i = 0; i < telas.length; i++) {
        telas[i].classList.remove('ativa');
      }
      document.getElementById('tela-' + nomeTela).classList.add('ativa');
    }

    // --- BLOCO DE NOTAS ---
    var campoNota = document.getElementById('campo-nota');
    if (campoNota) {
      campoNota.value = localStorage.getItem('minha_nota') || '';
    }

    function salvarNota() {
      localStorage.setItem('minha_nota', campoNota.value);
      alert('Nota salva!');
    }

    // --- LISTA DE TAREFAS ---
    var tarefas = JSON.parse(localStorage.getItem('minhas_tarefas')) || [];

    function renderizarTarefas() {
      var lista = document.getElementById('lista-tarefas');
      if (!lista) return;
      lista.innerHTML = '';

      for (var i = 0; i < tarefas.length; i++) {
        var item = document.createElement('li');
        item.innerHTML = '<span>' + tarefas[i] + '</span><button onclick="removerTarefa(' + i + ')">X</button>';
        lista.appendChild(item);
      }
    }

    function adicionarTarefa() {
      var input = document.getElementById('nova-tarefa');
      if (input.value.trim() === '') return;

      tarefas.push(input.value);
      localStorage.setItem('minhas_tarefas', JSON.stringify(tarefas));
      input.value = '';
      renderizarTarefas();
    }

    function removerTarefa(index) {
      tarefas.splice(index, 1);
      localStorage.setItem('minhas_tarefas', JSON.stringify(tarefas));
      renderizarTarefas();
    }

    renderizarTarefas();

    // --- CALCULADORA ---
    function digitarCalc(valor) {
      var visor = document.getElementById('visor-calc');
      if (visor.value === 'Erro') visor.value = '';
      visor.value = visor.value + valor;
    }

    function limparCalc() {
      document.getElementById('visor-calc').value = '';
    }

    function calcularResultado() {
      var visor = document.getElementById('visor-calc');
      try {
        visor.value = eval(visor.value);
      } catch (e) {
        visor.value = 'Erro';
      }
    }

    // --- JOGO JOKENPÔ ---
    function jogar(escolhaUsuario) {
      var opcoes = ['Pedra', 'Papel', 'Tesoura'];
      var escolhaKindle = opcoes[Math.floor(Math.random() * 3)];
      var resultado = '';

      if (escolhaUsuario === escolhaKindle) {
        resultado = 'Empate!';
      } else if (
        (escolhaUsuario === 'Pedra' && escolhaKindle === 'Tesoura') ||
        (escolhaUsuario === 'Papel' && escolhaKindle === 'Pedra') ||
        (escolhaUsuario === 'Tesoura' && escolhaKindle === 'Papel')
      ) {
        resultado = 'Você venceu!';
      } else {
        resultado = 'O Kindle venceu!';
      }

      document.getElementById('resultado-jogo').innerText = 
        'Você: ' + escolhaUsuario + ' | Kindle: ' + escolhaKindle + ' -> ' + resultado;
    }
  </script>
</body>
</html>
